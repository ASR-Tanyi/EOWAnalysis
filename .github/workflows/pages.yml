name: Publish ExeFS explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eow-pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      inputs: ${{ steps.plan.outputs.inputs }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ziglang==0.17.0.post0
      - run: python tools/eow.py index
      - run: python -m unittest discover -s tests -v
      - id: plan
        run: |
          echo "matrix=$(python tools/pages.py plan)" >> "$GITHUB_OUTPUT"
          echo "inputs=$(git ls-tree -r HEAD -- ExeFS tools requirements.txt vendor/eowrecomp .github/workflows/pages.yml | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: eow-index
          path: build/index.sqlite
          retention-days: 1

  functions:
    needs: index
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.index.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v4
        id: cache
        with:
          path: build/shards
          key: eow-pages-${{ needs.index.outputs.inputs }}-${{ matrix.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install -r requirements.txt ziglang==0.17.0.post0
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: eow-index
          path: build
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/pages.py shard "${{ matrix.module }}" "${{ matrix.first }}" "${{ matrix.last }}"
      - uses: actions/upload-artifact@v4
        with:
          name: eow-blocks-${{ matrix.key }}
          path: build/shards
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: functions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ziglang==0.17.0.post0
      - uses: actions/download-artifact@v4
        with:
          name: eow-index
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: eow-blocks-*
          merge-multiple: true
          path: build/shards
      - name: Assemble detailed local HTML
        run: python tools/pages.py finish --out build/local-html --revision "$GITHUB_SHA"
      - name: Generate the compact public site and comparison logs
        run: |
          python tools/pages_report.py build/local-html --out build/site --logs build/comparison-logs --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat build/comparison-logs/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload detailed local HTML
        id: local-html
        uses: actions/upload-artifact@v4
        with:
          name: local-html
          path: build/local-html
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload comparison logs
        id: logs
        uses: actions/upload-artifact@v4
        with:
          name: comparison-logs
          path: build/comparison-logs
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Link this run's artifacts on public function pages
        env:
          HTML_URL: ${{ steps.local-html.outputs.artifact-url }}
          LOG_URL: ${{ steps.logs.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("build/site/manifest.json")
          m = json.loads(p.read_text())
          m["downloads"] = {"html": os.environ["HTML_URL"], "logs": os.environ["LOG_URL"]}
          p.write_text(json.dumps(m, separators=(",", ":")) + "\n")
          PY
      - name: Check public and detailed local HTML in Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/pages_browser.py build/local-html
          python tests/pages_browser.py build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
